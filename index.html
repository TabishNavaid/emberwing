<!doctype html>
<!-- the one page: a canvas for the game, plus a "rotate your phone" hint for portrait phones -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="Emberwing: The Way Home. Guide a young dragon home under the aurora. A lobby interactive for Symphonicon." />
    <title>Emberwing: The Way Home</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; cursor: none; }
      canvas#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #rotate {
        display: none; position: fixed; inset: 0; background: #05070d; color: #ffc94a;
        font: 700 28px/1.2 system-ui, sans-serif; letter-spacing: 0.08em;
        flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center;
      }
      #rotate svg { width: 120px; height: 120px; animation: tilt 2.4s ease-in-out infinite; }
      @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; transform: rotate(-90deg); } }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="rotate" aria-live="polite">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="20" y="6" width="24" height="44" rx="4" fill="none" stroke="#ffc94a" stroke-width="4" />
        <rect x="29" y="43" width="6" height="3" fill="#ffc94a" />
        <path d="M50 52 a14 14 0 0 1 -14 8" fill="none" stroke="#3ff0d8" stroke-width="3" />
        <path d="M34 56 l3 5 l4 -4 z" fill="#3ff0d8" />
      </svg>
      <div>ROTATE YOUR PHONE</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
