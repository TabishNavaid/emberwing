<!doctype html>
<!-- the one page: a canvas for the game, plus a "turn your phone" screen for portrait phones -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="Emberwing: The Way Home. Guide a young dragon home under the aurora. A lobby interactive for Symphonicon." />
    <title>Emberwing: The Way Home</title>
    <style>
      /* no scrolling, pinch zoom, double tap zoom or pull to refresh while someone is playing */
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: none; }
      canvas { image-rendering: crisp-edges; image-rendering: pixelated; }
      canvas#screen { position: fixed; display: block; }
      /* main.js reads the notch and home bar insets off this. the tests set --safe-* to fake them */
      #safe {
        position: fixed; visibility: hidden; pointer-events: none;
        padding: var(--safe-top, env(safe-area-inset-top)) var(--safe-right, env(safe-area-inset-right))
          var(--safe-bottom, env(safe-area-inset-bottom)) var(--safe-left, env(safe-area-inset-left));
      }
      #rotate {
        display: none; position: fixed; inset: 0; background: #05070d;
        flex-direction: column; align-items: center; justify-content: center; gap: 6vh;
      }
      #rotate canvas { display: block; }
      #turn-dragon { width: 46vw; }
      #turn-phone { width: 14vw; animation: tilt 2.4s ease-in-out infinite; }
      #turn-text { width: 78vw; }
      .say { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
      @media (prefers-reduced-motion: reduce) { #turn-phone { animation: none; transform: rotate(-90deg); } }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="safe"></div>
    <div id="rotate" aria-live="polite">
      <canvas id="turn-dragon"></canvas>
      <canvas id="turn-phone"></canvas>
      <canvas id="turn-text"></canvas>
      <span class="say">Turn your phone sideways to play</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
